<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbucks — Barista KDS Pha Chế</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            colors: {
              'sbk-green': '#006241',
              'sbk-dark': '#1e3932',
              'sbk-light': '#f2f0eb',
              'sbk-cream': '#d4e9e2',
              'sbk-gold': '#cba258',
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans min-h-screen p-6 select-none">

  <div class="max-w-7xl mx-auto space-y-6">
    <header class="bg-sbk-green text-white p-4 rounded-2xl shadow flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-white text-sbk-green rounded-full flex items-center justify-center font-black text-xs shadow">KDS</div>
        <div>
          <h1 class="font-bold text-base uppercase tracking-wider text-white">MÀN HÌNH BARISTA KITCHEN DISPLAY (KDS)</h1>
          <p class="text-xs text-emerald-100">Nhận Đơn Hàng Tự Động Real-Time Từ Kiosk Tự Chọn</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span id="order-count-badge" class="bg-sbk-gold text-sbk-dark font-bold text-xs px-3.5 py-1.5 rounded-full shadow-sm">0 Đơn Đang Chờ</span>
        <a href="/" class="text-xs font-bold bg-white text-sbk-dark hover:bg-gray-100 px-3.5 py-1.5 rounded-full transition shadow">Quay Lại Portal (3 Roles)</a>
        <button id="logout-btn" class="text-xs font-bold bg-red-600 hover:bg-red-700 text-white px-3.5 py-1.5 rounded-full transition shadow">Đăng Xuất</button>
      </div>
    </header>

    <!-- Orders Grid -->
    <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <p class="col-span-full text-center py-12 text-slate-400 font-bold text-sm">Chưa có đơn hàng nào đang chờ pha chế...</p>
    </div>
  </div>

  <script src="/js/barista.js"></script>
</body>
</html>
